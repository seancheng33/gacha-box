{% extends "base.html" %}
{% block title %}登录 · 欧皇运维所{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>登录</h1>
  <p class="sub">抽卡要趁早，欧气不等人</p>
  <form method="post" class="form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>用户名<input name="username" autocomplete="username" required autofocus></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary block" type="submit">进入盲盒</button>
  </form>
  <p class="switch">还没有账号？<a href="{{ url_for('register') }}">注册一个</a></p>
</div>
{% endblock %}
